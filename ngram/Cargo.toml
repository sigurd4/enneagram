[package]
name = "ngram"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "An ngram library"
repository = "https://github.com/sigurd4/enneagram"
keywords = ["enneagram", "graph", "psychology", "occult", "enneatype"]
categories = ["algorithms", "mathematics"]
authors = ["Sigurd Sætherø Spangelo"]

[features]
default = ["artwork", "pivot"]
pivot = []
artwork = ["dep:ratatui", "dep:ratatui-3d"]

[dependencies]
moddef = { workspace = true }
num = { workspace = true }
array_trait = { workspace = true }
ratatui-3d = {version = "0.1.0", optional = true}
ratatui = {version = "0.30.0", optional = true}
thiserror = { workspace = true }